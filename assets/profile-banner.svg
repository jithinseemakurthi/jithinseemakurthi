  <g fill="#9cecf3"><circle cx="1013" cy="153" r="2.5"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite" /></circle><circle cx="1330" cy="163" r="2.5"><animate attributeName="opacity" values=".4;1;.4" dur="4.7s" repeatCount="indefinite" /></circle><circle cx="1004" cy="246" r="2.5"><animate attributeName="opacity" values=".4;1;.4" dur="3.9s" repeatCount="indefinite" /></circle><circle cx="1331" cy="252" r="2.5"><animate attributeName="opacity" values=".35;1;.35" dur="5s" repeatCount="indefinite" /></circle></g>
