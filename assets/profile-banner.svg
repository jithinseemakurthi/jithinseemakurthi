    <g><rect x="1013" y="276" width="132" height="33" rx="10" fill="#101a29" stroke="#61d7b2" stroke-opacity=".34" /><text x="1029" y="296" fill="#d5fff0">ECE / EMBEDDED</text></g>
    <g><rect x="1214" y="278" width="121" height="33" rx="10" fill="#171328" stroke="#e08be0" stroke-opacity=".34" /><text x="1230" y="298" fill="#f6d9f3">CONNECTED</text></g>
