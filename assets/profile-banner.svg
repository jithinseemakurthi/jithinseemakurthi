  <circle cx="1160" cy="194" r="7" fill="#5be6f4" filter="url(#blur)" opacity=".8" /><circle cx="1160" cy="194" r="5" fill="#b6fbff"><animate attributeName="r" values="4.5;7;4.5" dur="3.8s" repeatCount="indefinite" /><animate attributeName="opacity" values=".55;1;.55" dur="3.8s" repeatCount="indefinite" /></circle>
