    <text x="94" y="239" fill="#dde5f2" font-size="21" font-weight="500">Software for the screen. Intelligence for the system.</text>
    <text x="94" y="275" fill="#a6b4c8" font-size="14" font-weight="500" letter-spacing=".2">Full-stack products  ·  Agentic AI  ·  Connected electronics</text>
    <text x="94" y="344" fill="#8290a7" font-family="DM Mono,monospace" font-size="10" font-weight="500" letter-spacing="1.8">BUILDING AT THE EDGE OF SOFTWARE &amp; HARDWARE</text>
  </g>
  <g fill="none" stroke="url(#neon)" stroke-width="1">
