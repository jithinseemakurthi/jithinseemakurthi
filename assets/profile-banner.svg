<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title description">
  <title id="title">Jithin Seemakurthi — Software Developer</title>
  <desc id="description">A dark, modern technology banner highlighting applied AI, geospatial systems, and real-time applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521" />
      <stop offset="0.56" stop-color="#0b1726" />
      <stop offset="1" stop-color="#10152b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61e6dc" />
      <stop offset="1" stop-color="#8b9eff" />
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="52%" r="45%">
      <stop offset="0" stop-color="#528cf0" stop-opacity="0.19" />
      <stop offset="1" stop-color="#528cf0" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a6c4ff" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="320" rx="24" fill="url(#background)" />
  <rect width="1400" height="320" rx="24" fill="url(#grid)" />
  <rect width="1400" height="320" rx="24" fill="url(#glow)" />
  <path d="M0 278C260 248 410 314 670 276s478-58 730-25v69H0z" fill="#07101c" fill-opacity="0.45" />

  <g fill="none" stroke="#7ddde1" stroke-opacity="0.23" stroke-width="1.2">
    <path d="M930 90l92 42 86-44 82 59 100-39" />
    <path d="M950 210l72-78 86 78 82-63 100 63" />
    <path d="M1022 132v78m86-122v122m82-63v63m100-102v102" stroke-opacity="0.15" />
    <circle cx="930" cy="90" r="4" fill="#68ded7" />
    <circle cx="1022" cy="132" r="4" fill="#68ded7" />
    <circle cx="1108" cy="88" r="4" fill="#9aa9ff" />
    <circle cx="1190" cy="147" r="4" fill="#68ded7" />
    <circle cx="1290" cy="108" r="4" fill="#9aa9ff" />
    <circle cx="950" cy="210" r="4" fill="#9aa9ff" />
    <circle cx="1022" cy="210" r="4" fill="#68ded7" />
    <circle cx="1108" cy="210" r="4" fill="#68ded7" />
    <circle cx="1290" cy="210" r="4" fill="#68ded7" />
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="92" y="92" fill="#72dedb" font-size="14" font-weight="700" letter-spacing="3.2">SOFTWARE DEVELOPER</text>
    <text x="88" y="158" fill="#f3f7ff" font-size="48" font-weight="700" letter-spacing="-1.6">Jithin Seemakurthi</text>
    <rect x="92" y="184" width="82" height="3" rx="1.5" fill="url(#accent)" />
    <text x="92" y="222" fill="#c3cede" font-size="18" font-weight="500">Applied AI · Geospatial systems · Real-time applications</text>
    <text x="92" y="256" fill="#8293aa" font-size="12" font-weight="600" letter-spacing="1.7">LOCAL-FIRST AI  /  DATA PRODUCTS  /  HUMAN-CENTERED TOOLS</text>
  </g>

  <g filter="url(#softGlow)" opacity="0.85">
    <circle cx="1108" cy="88" r="2.5" fill="#b7c4ff" />
    <circle cx="1190" cy="147" r="2.5" fill="#7cf1e5" />
    <circle cx="1290" cy="210" r="2.5" fill="#7cf1e5" />
  </g>
</svg>
