<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title description">
  <title id="title">Jithin Seemakurthi — Full-stack, AI, and ECE</title>
  <desc id="description">A dark navy and neon cyan portfolio banner with an animated circuit constellation. Click to open the interactive 3D portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12" /><stop offset=".57" stop-color="#101626" /><stop offset="1" stop-color="#151027" /></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#5be6f4" /><stop offset=".55" stop-color="#a891ff" /><stop offset="1" stop-color="#e08be0" /></linearGradient>
    <radialGradient id="glow"><stop stop-color="#5be6f4" stop-opacity=".18" /><stop offset=".55" stop-color="#8e70fb" stop-opacity=".08" /><stop offset="1" stop-color="#8e70fb" stop-opacity="0" /></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bb0d1" stroke-opacity=".055" /><circle cx="0" cy="0" r="1" fill="#5be6f4" fill-opacity=".15" /></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="8" /></filter>
  </defs>
  <rect width="1440" height="390" rx="25" fill="url(#background)" /><rect width="1440" height="390" rx="25" fill="url(#grid)" /><ellipse cx="1135" cy="206" rx="390" ry="280" fill="url(#glow)" />
  <path d="M0 345C286 294 486 377 741 338s452-43 699 3v49H0z" fill="#05070c" fill-opacity=".4" /><path d="M0 345C286 294 486 377 741 338s452-43 699 3" fill="none" stroke="url(#neon)" stroke-opacity=".2" />
