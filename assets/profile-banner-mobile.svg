<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Jithin Seemakurthi — Interactive 3D Portfolio</title>
  <desc id="description">A compact charcoal and sage profile banner with a softly animated project constellation.</desc>
  <defs>
    <linearGradient id="mobileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101817" />
      <stop offset="0.58" stop-color="#1b2421" />
      <stop offset="1" stop-color="#2a2622" />
    </linearGradient>
    <linearGradient id="mobileAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b8a5" />
      <stop offset="0.55" stop-color="#d3bd95" />
      <stop offset="1" stop-color="#b29c96" />
    </linearGradient>
    <radialGradient id="mobileGlow">
      <stop offset="0" stop-color="#98ac9b" stop-opacity="0.15" />
      <stop offset="0.65" stop-color="#bea982" stop-opacity="0.05" />
      <stop offset="1" stop-color="#bea982" stop-opacity="0" />
    </radialGradient>
    <pattern id="mobileGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d4c7ad" stroke-opacity="0.035" />
    </pattern>
  </defs>
  <rect width="800" height="520" rx="28" fill="url(#mobileBg)" />
  <rect width="800" height="520" rx="28" fill="url(#mobileGrid)" />
  <ellipse cx="632" cy="326" rx="260" ry="230" fill="url(#mobileGlow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="48" width="218" height="32" rx="16" fill="#27332e" stroke="#b4b8a2" stroke-opacity="0.28" />
    <circle cx="67" cy="64" r="3.5" fill="#acb9a5" />
    <text x="81" y="68" fill="#dcddcf" font-size="10" font-weight="700" letter-spacing="1.5">SOFTWARE · APPLIED AI · DATA</text>

    <text x="46" y="151" fill="#f1eee6" font-size="54" font-weight="700" letter-spacing="-1.8">Jithin</text>
    <text x="46" y="207" fill="#f1eee6" font-size="49" font-weight="700" letter-spacing="-1.8">Seemakurthi</text>
    <rect x="50" y="226" width="104" height="4" rx="2" fill="url(#mobileAccent)" />
    <text x="50" y="267" fill="#ded9ce" font-size="17" font-weight="500">Building software where AI meets</text>
    <text x="50" y="292" fill="#ded9ce" font-size="17" font-weight="500">the real world.</text>
  </g>

  <g fill="none" stroke="url(#mobileAccent)" stroke-opacity="0.31" stroke-width="1.2">
    <ellipse cx="634" cy="346" rx="132" ry="60" transform="rotate(-24 634 346)" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" values="-24 634 346;336 634 346" dur="76s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="634" cy="346" rx="108" ry="45" transform="rotate(34 634 346)" stroke-opacity="0.2" />
    <path d="M512 307c46 31 55 68 112 39s80-64 131-22" />
  </g>
  <circle cx="634" cy="346" r="23" fill="#29322d" stroke="url(#mobileAccent)" stroke-opacity="0.65" stroke-width="1.4" />
  <circle cx="634" cy="346" r="6" fill="#c5b38e">
    <animate attributeName="r" values="5.5;7;5.5" dur="5.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.62;0.9;0.62" dur="5.5s" repeatCount="indefinite" />
  </circle>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">
    <rect x="474" y="294" width="94" height="29" rx="14" fill="#29322e" stroke="#abb5a5" stroke-opacity="0.28" />
    <text x="491" y="312" fill="#e0e0d5">LOCAL AI</text>
    <rect x="675" y="308" width="95" height="29" rx="14" fill="#2b302d" stroke="#b3afa0" stroke-opacity="0.28" />
    <text x="693" y="326" fill="#e2ded2">GEO DATA</text>
    <rect x="520" y="397" width="132" height="29" rx="14" fill="#2c302d" stroke="#b9a7a0" stroke-opacity="0.3" />
    <text x="538" y="415" fill="#e6ded7">LIVE SYSTEMS</text>
  </g>

  <text x="50" y="476" fill="#98978d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">TAP TO EXPLORE THE INTERACTIVE 3D PROFILE ↗</text>
</svg>
